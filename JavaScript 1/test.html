<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<script>
  let result = 0, result2 = 0;
  for (i=0; i<10; ++i) {
      console.log(i);
      result = result + i;
  }
  console.log(result);
  let j = 0;
  while (j < 10) {
      console.log(j);
      result2 = result2 + j;;
  }
  console.log(result2);
</script>
</body>
</html>
