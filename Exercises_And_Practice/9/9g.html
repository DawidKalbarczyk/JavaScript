<!DOCTYPE html>
<html lang="en">

<body>
<p>YouTube Subscribe Button</p>
<button class="js-subscribe-button">Subscribe</button>
<p></p>
<p>Amazon Shipping Calculator</p>
<p>Orders under $40 = + $10 shipping.</p>
<p>Orders over $40 = FREE shipping.</p>
<input class="js-textbox" type="textbox" placeholder="Cost of order" onkeydown="
      isEnter(event);
  ">
<button onclick="
    calculateTotal();
  ">Calculate</button>
<p class="js-total-cost"></p>
<script>
    String(25);
    console.log('25'- 5 );
    console.log('25' + 5);

    window.document
    window.console.log('window');
    window.alert('')
    function isEnter(event) {
        if (event.key === 'Enter') {
            calculateTotal();
        }
    }
    function calculateTotal() {
        const inputElement = document.querySelector('.js-textbox');
        let cost = (Number(inputElement.value))*100;
        if (cost < 4000) {
            cost = (cost + 1000)/100;
        } else {
            cost = cost;
        }
        document.querySelector('.js-total-cost')
            .innerHTML = `$${cost}`;
    }

    let subscribeButtonElement = document.querySelector('.js-subscribe-button');

    subscribeButtonElement.onclick = onSubscribe;

    function onSubscribe() {
        if (subscribeButtonElement.innerText === 'Subscribe') {
            subscribeButtonElement.innerText = 'Subscribed';
        } else if (subscribeButtonElement.innerText === 'Subscribed') {
            subscribeButtonElement.innerText = 'Subscribe';
        }
    }



</script>
</body>
</html>
