<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>7g-h-i</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
  <script>
    function convertLength(length, from, to) {
      if (from === 'km' && to === 'miles') {
          output = `${Math.round(length/(1.609344))} miles`;
      } else if (from === 'miles' && to === 'km') {
          output = `${Math.round(length*(1.609344))} km`;

      } else if (from === 'km' && to === 'km') {
          output = `${length} km`;

      } else if (from === 'miles' && to === 'miles') {
          output = `${length} miles`;

      } else if (from === 'km' && to === 'ft') {
          output = `${length*3281} ft`;

      } else if (from === 'miles' && to === 'ft') {
          output = `${length*5280} ft`;

      } else if (from === 'ft' && to === 'km') {
          output = `${(length/3281).toFixed(4)} km`;

      } else if (from === 'ft' && to === 'miles') {
          output = `${(length/5280).toFixed(4)} miles`;

      } else if (from === 'ft' && to === 'ft') {
          output = `${length} ft`;
      } else {
          output = `Invalid unit ${from} or ${to}.`
      }
      return output;
    }
    /*
    console.log(convertLength(50, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(50, 'km', 'km'));

     */
    console.log((convertLength(5,'miles','km')));
    console.log(convertLength(5,'miles','ft'));
    console.log(convertLength(5,'km','ft'));
    console.log(convertLength(1000,'ft','km'));
    console.log(convertLength(1000,'ft','ft'));
    console.log(convertLength(1000,'ft','miles'));
    console.log(convertLength(1000,'lbs','lbs'));

  </script>
</body>
</html>
