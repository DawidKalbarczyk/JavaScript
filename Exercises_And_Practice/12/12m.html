<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>12m</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<button class="js-add-button">
  Add
</button>
<button class="js-remove-button">
  Remove
</button>
<script>
   function addNum(array,num) {
       return array.map((value) => value+num);
   }
   console.log(addNum([1,2,3],2));
   console.log(addNum([-2,-1,0,99],2));
</script>
</body>
</html>
