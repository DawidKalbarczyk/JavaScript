<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>12h</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<button onclick="result++; updateTitle();">
  Add
</button>
<button onclick="result--; updateTitle();">
  Remove
</button>
<script>
    let result = 0;
    function updateTitle() {
        document.title = `(${result}) New messages`;
        setTimeout(function () {
            document.title = 'App';
        }, 2000)

    }

</script>
</body>
</html>
