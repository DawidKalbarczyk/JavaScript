<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>12o</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<button class="js-add-button">
  Add
</button>
<button class="js-remove-button">
  Remove
</button>
<script>
    function removeEgg(foods) {
        let count = 0;
        return foods.filter((food) => {
            if (food === 'egg' && count !== 2) {
                count++;
                return false;
            }
            return true;
        });
    }
    console.log(removeEgg(['egg','apple','egg','egg','ham']));
</script>
</body>
</html>
