  <title>11i</title>
  <style>
      body {
          background-color: gray;

  </style>

<body>
<script>
    addNum([1,2,3], 2);
    addNum([1,2,3], 3);
    addNum([-2,-1,0,99], 2)

    function addNum(array, num) {
        nums = [];
        for (let i = 0; i < array.length; i++) {
            nums.push(array[i]+num);

        }
        console.log(nums);
    }
</script>
