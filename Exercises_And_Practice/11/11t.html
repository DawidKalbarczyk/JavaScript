<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11t</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<script>
    removeEgg(['egg', 'apple', 'egg', 'egg', 'ham'].reverse())

    function removeEgg(foods) {
        times = 0;
        for  (let i = 0; i < foods.length; i++) {
            if (foods[i] === 'egg') {
                times = times + 1;
                if (times > 2) {
                    continue;
                } else {
                    foods.splice(i, 1);
                    i -= 1;
                }
            } else {
                continue;
            }
        }
        console.log(foods.reverse());
    }
</script>
</body>
