<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11l</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<script>
  minMax([-6,-5,-3,5]);
  minMax([-2,3,-5,7,10]);
  function minMax(nums) {
      object = {
          min: nums[0],
          max: nums[0]
      }
      for (let i = 0; i < nums.length; i++) {
          if (nums[i] < object.min) {
              object.min = nums[i];
          }
          if (nums[i] > object.max) {
              object.max = nums[i];
          }
      }
      console.log(object);
  }
</script>
</body>
</html>
