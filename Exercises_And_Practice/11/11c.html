<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11c</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<script>
    arraySwap([1,20,22,24,5]);
    arraySwap(['hi','hello','good']);
    function arraySwap(array) {
        firstValue = array[0];
        for (let i = 0; i < array.length; i++) {
            lastValue = array[i];
            index = i;
        }
        array[0] = lastValue;
        array[index] = firstValue;
        console.log(array);
    }
</script>
</body>
</html>
