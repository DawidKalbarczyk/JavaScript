  const nums = [1,1,3];
  let numsDoubled = [];
  console.log(doubleNums(nums));
  console.log(doubleNums([2,2,5, 0, 5]));
  function doubleNums(selector) {
      for (let i = 0; i < selector.length; i++) {
          if (selector[i] === 0) {
              numsDoubled[i] = 0;
          } else {
              numsDoubled[i] = selector[i] * 2;
          }

      }
      return numsDoubled;
