<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11k</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<script>
    countPositive([1,-3,5]);
    countPositive([-2,3,-5,-7,-10]);

    function countPositive(nums) {
        count = 0;
        for (let i = 0; i < nums.length; i++) {
            if (nums[i] > 0) {
                count++;
            }
        }
        console.log(count);
    }
</script>
</body>
</html>
