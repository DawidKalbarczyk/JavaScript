<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11m</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<script>
  countWords(['apple','grape','apple','apple'])
  function countWords(words) {
      const object = {};
      for (let i=0; i<words.length; i++) {
          const word = words[i];
          if (object[word]) {
              object[word] ++;
          } else {
              object[word] = 1;
          }

      }
      console.log(object);
  }
</script>
</body>
</html>
