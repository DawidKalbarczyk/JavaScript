<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11p</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
<script>

    stringLoop(['hello', 'world', 'search', 'good', 'search']);
    stringLoop(['not', 'found']);
    function stringLoop(array) {
        let result = -1;
        for (let i = 0; i < array.length; i++) {
            if (array[i] === 'search') {
                result = i;
                break;
            }
        }
        console.log(result);
    }
</script>
</body>
</html>
