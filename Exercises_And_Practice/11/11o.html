<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11o</title>
  <style>
      body {
          background-color: gray;
      }
  </style>
</head>
<body>
  <script>
    stringLoop(['hello', 'world', 'search', 'good']);
    stringLoop(['not', 'found']);
    function stringLoop(array) {
        for (let i = 0; i <= array.length; i++) {
            if (array[i] === 'search') {
                result = i;
                break;
            } else {
                result = -1;
            }
        }
        console.log(result);
    }
  </script>
</body>
</html>
