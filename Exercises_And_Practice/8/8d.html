<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8d</title>
</head>
<body>
  <script>
    const product1 = {
        name: 'basketball',
        price: 100
    }
    const product2 = {
        name: 'baseball',
        price: 1000,
    }
    function comparePrice(product1, product2) {
        if (product1.price > product2.price) {
            return product2.price
        } else {
            return product1.price
        }
    }
    console.log(comparePrice(product1, product2));
  </script>
</body>
</html>
