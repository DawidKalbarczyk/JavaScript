<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8i</title>
  <style>body {
      background-color: gray;
  }
  .wynik-css {
      white-space: pre-line;
      text-align: center;
      display: inline-block;
      margin-left: 10px;
  }
  </style>
</head>
<body>
  <div style="display: block; height: 20px;">
    <button onclick="
    const bet = 'heads';
    guess(bet);
  ">heads</button>
    <button onclick="
    const bet = 'tails';
    guess(bet);
  ">tails</button>
  </div>

  <p class="wynik-css" id="wynikPlus">Wins</p>
  <p class="wynik-css" id="wynikMinus">Loses</p>
  <script>

      let score =  JSON.parse(localStorage.getItem('score')) || {
          wins: 0,
          loses: 0
      }
      function updateScoreboard() {
          document.getElementById("wynikPlus").textContent = `Wins \n${score.wins}`;
          document.getElementById("wynikMinus").textContent = `Loses \n${score.loses}`;
      }

      function guess(bet) {
          let randomNumber = Math.random();
          if (randomNumber < 0.5) {
              compPick = 'heads';
          } else {
              compPick = 'tails';
          }
          console.log(compPick);
          if (compPick === bet) {
              result = 'You win';
              score.wins++;
          } else {
              result = 'You lose';
              score.loses++;
          }
          console.log(score);
          localStorage.setItem('score', JSON.stringify(score));
          updateScoreboard();
      }
      updateScoreboard();
</script>
</body>
</html>
