<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tracking</title>
  <link rel="stylesheet" href="style/amazon.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/track.css">
</head>
<body>
  <div class="headbar">
    <div class="headbar1">
      <a href="http://localhost:63342/JS%20Course/Exercises_And_Practice/amazon-project-bymself/amazon.html">
        <img class="amazon-logo" src="images/amazon-logo-white.png">
        <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png">
      </a>

    </div>

    <div class="headbar2">
      <input class="input-bar" type="textbox" placeholder="Search">
      <button class="search-button">
        <img class="search-icon" src="images/icons/search-icon.png">
      </button>
    </div>
    <div class="headbar3">
      <a style="text-decoration: none;" href="http://localhost:63342/JS%20Course/Exercises_And_Practice/amazon-project-bymself/orders.html">
        <div class="return-orders-container">
          <p class="return-orders">Returns <span class="orders-text">& Orders</span></p>
        </div>
      </a>
      <a style="text-decoration: none;" href="http://localhost:63342/JS%20Course/Exercises_And_Practice/amazon-project-bymself/checkout.html">
        <div class="cart-info-container">
          <img class="cart-icon" src="images/icons/cart-icon.png">
          <div class="cart-number">3</div>
        <div class="cart-text">Cart</div>
        </div>
      </a>
    </div>
  </div>

<!-- Content -->
  <div class="main-grid">
    <div class="main-container">
      <a href="http://localhost:63342/JS%20Course/Exercises_And_Practice/javascript-amazon-project-main/javascript-amazon-project-main/orders.html">
        <p>View all orders</p>
      </a>
      <div class="delivery-info">
        <div class="delivery-date">Arriving on Monday, June 13</div>
        <div>Black and Gray Athletic Cotton Socks - 6 Pairs</div>
        <div>Quantity: 1</div>
        <img class="delivery-image" src="images/products/athletic-cotton-socks-6-pairs.jpg">
      </div>
      <div class="delivery-status-container">
        <div class="delivery-status-text">
          <div>Preparing</div>
          <div><span style="color: #016c30;">Shipped</span></div>
          <div>Delivered</div>
        </div>
        <div style="display: block; width: 100%;">
          <div class="delivery-status-bar">
            <div class="delivery-status-bar-state"></div>
            <div></div>
          </div>
        </div>

      </div>

    </div>
  </div>


</body>
</html>
