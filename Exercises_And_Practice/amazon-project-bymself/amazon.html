<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Project Dawid</title>
  <link rel="stylesheet" href="style/amazon.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="headbar">
    <div class="headbar1">
      <a href="http://localhost:63342/JS%20Course/Exercises_And_Practice/amazon-project-bymself/amazon.html">
        <img class="amazon-logo" src="images/amazon-logo-white.png">
        <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png">
      </a>

    </div>

    <div class="headbar2">
      <input class="input-bar" type="textbox" placeholder="Search">
      <button class="search-button">
        <img class="search-icon" src="images/icons/search-icon.png">
      </button>
    </div>

    <div class="headbar3">

    </div>
  </div>

      </div>
      <div class="item-info-container">
        <p class="item-info">Black and Gray Athletic Cotton Socks - 6 Pairs</p>
        <div class="stars-container">
          <img class="stars-photo" src="images/ratings/rating-45.png">
          <p class="stars-text">87</p>
        </div>
        <p class="item-price">$10.90</p>
        <select class="option-select">

          <img class="stars-photo" src="images/ratings/rating-40.png">

        <select class="option-select">
          <option value="1">1</option>

    </div>

    <div class="item-container">
      <div class="photo-container">
        <img class="photo" src="images/products/adults-plain-cotton-tshirt-2-pack-teal.jpg">
      </div>
      <div class="item-info-container">
        <p class="item-info">Adults Plain Cotton T-Shirt - 2 Pack</p>
        <div class="stars-container">
          <img class="stars-photo" src="images/ratings/rating-45.png">

        </div>
        <p class="item-price">$7.99</p>

      </div>
      <div class="item-info-container">

</html>
